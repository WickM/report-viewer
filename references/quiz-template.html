<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[TITEL]</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  .quiz-wrap { max-width: 760px; margin: 0 auto; }
  .quiz-progress { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem; }
  .quiz-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.4rem; margin-bottom: 1rem;
  }
  .quiz-q { font-weight: 600; font-size: 1.05rem; margin-bottom: 0.9rem; }
  .quiz-opt {
    display: block; width: 100%; text-align: left; padding: 0.7rem 1rem;
    margin-bottom: 0.45rem; background: var(--bg-hover);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); cursor: pointer; font-size: 0.95rem;
  }
  .quiz-opt:hover:not([data-done]) { border-color: var(--accent); }
  .quiz-opt.correct { border-color: #3fb950; background: rgba(63,185,80,0.12); }
  .quiz-opt.wrong { border-color: #f85149; background: rgba(248,81,73,0.12); }
  .quiz-opt[data-done] { cursor: default; }
  .quiz-fb { margin-top: 0.6rem; font-size: 0.9rem; min-height: 1.2em; }
  .quiz-score { font-size: 1.15rem; font-weight: 600; margin-top: 1.2rem; }
  .quiz-saved { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.4rem; }
</style>
</head>
<body class="report-body">
<header>
  <a href="/">← Übersicht</a>
  <h1>[TITEL]</h1>
</header>
<main class="report-content">
<div class="quiz-wrap">
  <p class="quiz-progress" id="quiz-progress"></p>
  <div id="quiz-root"></div>
  <p class="quiz-score" id="quiz-score" hidden></p>
  <p class="quiz-saved" id="quiz-saved"></p>
</div>

<script>
/* Quiz-Engine: lädt /api/quiz/result automatisch, wenn ein Quiz fertig ist.
   window.__REPORT_FILENAME__ wird vom Report-Viewer injiziert. */
(function () {
  "use strict";

  var QUESTIONS = [
    /* [FRAGE] */
    {
      q: "[FRAGE 1]",
      options: ["[A]", "[B]", "[C]", "[D]"],
      correct: 0,
      why: "[ERKLÄRUNG warum die richtige Antwort stimmt]"
    }
    /* --- mehr Fragen hier einfügen --- */
  ];

  var answered = 0, score = 0;
  var answers = [];
  var root = document.getElementById("quiz-root");
  var prog = document.getElementById("quiz-progress");
  var scoreEl = document.getElementById("quiz-score");
  var savedEl = document.getElementById("quiz-saved");

  function updateProgress() {
    prog.textContent = answered + " / " + QUESTIONS.length + " beantwortet";
    if (answered === QUESTIONS.length) {
      scoreEl.hidden = false;
      scoreEl.textContent = "Ergebnis: " + score + " / " + QUESTIONS.length;
      saveResult();
    }
  }

  function saveResult() {
    var payload = {
      filename: window.__REPORT_FILENAME__ || "",
      score: score,
      total: QUESTIONS.length,
      answers: answers
    };
    fetch("/api/quiz/result", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        savedEl.textContent = d
          ? "✓ Ergebnis gespeichert (" + new Date(d.ts).toLocaleString("de-AT") + ")"
          : "⚠ Ergebnis konnte nicht gespeichert werden";
      })
      .catch(function () { savedEl.textContent = "⚠ Ergebnis konnte nicht gespeichert werden"; });
  }

  QUESTIONS.forEach(function (item, qi) {
    var card = document.createElement("div");
    card.className = "quiz-card";

    var q = document.createElement("div");
    q.className = "quiz-q";
    q.textContent = (qi + 1) + ". " + item.q;
    card.appendChild(q);

    var fb = document.createElement("div");
    fb.className = "quiz-fb";

    item.options.forEach(function (opt, oi) {
      var b = document.createElement("button");
      b.className = "quiz-opt";
      b.textContent = opt;
      b.addEventListener("click", function () {
        if (b.dataset.done) return;
        var btns = card.querySelectorAll(".quiz-opt");
        btns.forEach(function (x) { x.dataset.done = "1"; });
        var ok = oi === item.correct;
        if (ok) {
          b.classList.add("correct");
          score++;
          fb.textContent = "✓ Richtig. " + item.why;
        } else {
          b.classList.add("wrong");
          btns[item.correct].classList.add("correct");
          fb.textContent = "✗ Leider falsch. " + item.why;
        }
        answers.push({ q: item.q, correct: ok, chosen: oi, expected: item.correct });
        answered++;
        updateProgress();
      });
      card.appendChild(b);
    });

    card.appendChild(fb);
    root.appendChild(card);
  });

  updateProgress();
})();
</script>
</main>
<footer><small>Report-Viewer · Quiz</small></footer>
</body>
</html>
